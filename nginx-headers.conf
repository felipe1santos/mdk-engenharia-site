# Cabecalhos aplicados a todas as respostas.
#
# Vive num arquivo separado por causa de uma regra do nginx que pega muita
# gente: `add_header` so e herdado de um nivel para o outro se o nivel filho
# NAO declarar nenhum add_header proprio. Como os blocos `location` daqui
# definem Cache-Control, eles cancelariam silenciosamente todos os cabecalhos
# de seguranca declarados no `server`. Incluir este arquivo em cada bloco
# resolve sem duplicar as linhas.
#
# O site nao tem login, formulario nem dado de usuario, entao a superficie e
# pequena — mas estes cabecalhos sao gratuitos e evitam clickjacking e sniffing
# de MIME.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
