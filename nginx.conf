server {
    listen 80;
    # Bind tambem em IPv6: dentro do container, `localhost` resolve ::1 antes de
    # 127.0.0.1, e sem esta linha o healthcheck recebe "connection refused"
    # mesmo com o nginx no ar.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anunciar a versao do nginx em respostas e paginas de erro.
    server_tokens off;

    # Cabecalhos de seguranca. O site nao tem login nem formulario, entao a
    # superficie e pequena, mas estes sao gratuitos e evitam clickjacking e
    # sniffing de MIME.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Assets com hash no nome nunca mudam de conteudo: cache imutavel por um ano.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # O HTML precisa ser revalidado a cada visita, senao um deploy novo demora a
    # aparecer para quem ja acessou.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
